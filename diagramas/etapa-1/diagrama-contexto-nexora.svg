    <style>
      .title{font:700 30px Arial;fill:#172033}.subtitle{font:16px Arial;fill:#475569}.head{font:700 18px Arial;fill:#172033}.text{font:15px Arial;fill:#253047}.label{font:13px Arial;fill:#334155}.edge{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
